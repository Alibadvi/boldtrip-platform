services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: boldtrip
      POSTGRES_USER: boldtrip
      POSTGRES_PASSWORD: boldtrip
    ports:
      - '5432:5432'
    volumes:
      - boldtrip_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U boldtrip -d boldtrip']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  boldtrip_postgres:
