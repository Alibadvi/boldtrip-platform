name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: boldtrip_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d boldtrip_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/boldtrip_ci
      PAYLOAD_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Payload types
        run: pnpm generate:types

      - name: Generate Payload import map
        run: pnpm generate:importmap

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Rehearse migrations with an existing record
        run: pnpm exec tsx scripts/test-migration-preservation.ts

      - name: Database security flows
        run: pnpm test:integration

      - name: Rehearse database backup and restore
        env:
          CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          backup_dir=$(mktemp -d)
          trap 'rm -rf "$backup_dir"' EXIT
          docker exec "$CI_POSTGRES_CONTAINER" pg_dump -U postgres -d boldtrip_ci -Fc > "$backup_dir/database.dump"
          docker exec "$CI_POSTGRES_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE boldtrip_ci_restore'
          docker exec -i "$CI_POSTGRES_CONTAINER" pg_restore -U postgres -d boldtrip_ci_restore --no-owner --no-acl --exit-on-error < "$backup_dir/database.dump"
          counts_sql='SELECT (SELECT count(*) FROM customers), (SELECT count(*) FROM service_requests), (SELECT count(*) FROM customer_documents), (SELECT count(*) FROM payment_receipts), (SELECT count(*) FROM admin_notifications);'
          docker exec "$CI_POSTGRES_CONTAINER" psql -U postgres -d boldtrip_ci -Atc "$counts_sql" > "$backup_dir/before.txt"
          docker exec "$CI_POSTGRES_CONTAINER" psql -U postgres -d boldtrip_ci_restore -Atc "$counts_sql" > "$backup_dir/after.txt"
          cmp "$backup_dir/before.txt" "$backup_dir/after.txt"
          echo 'Restored customer, request, document, receipt and notification counts match.'

      - name: Prepare isolated browser fixtures
        run: pnpm exec tsx scripts/seed-e2e.ts

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Desktop and mobile customer flows
        run: pnpm exec playwright test

      - name: Browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 3

      - name: Production build
        env:
          NEXT_PUBLIC_SITE_URL: https://boldtrip.ir
        run: pnpm build

      - name: Build explicit migration runtime
        run: pnpm build:release-tools --standalone

      - name: Verify packaged migration runner
        run: |
          cp -R .next/static .next/standalone/.next/static
          cp -R public .next/standalone/public
          cp scripts/ops/db-preflight.sh scripts/ops/backup-cpanel.sh docs/RELEASE-2026-11-ASSESSMENT.md .next/standalone/release-tools/
          (cd .next/standalone && node release-tools/migrate.mjs --status)
          tar -czf boldtrip-cpanel.tar.gz -C .next/standalone .

      - name: Upload reviewed release candidate
        uses: actions/upload-artifact@v4
        with:
          name: boldtrip-cpanel-reviewed
          path: boldtrip-cpanel.tar.gz
          retention-days: 7
          if-no-files-found: error

