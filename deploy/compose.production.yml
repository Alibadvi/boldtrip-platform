services:
  app:
    build:
      context: ..
    image: boldtrip-platform:production
    env_file: ../.env.production
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [clamav]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health',{signal:AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
  jobs:
    image: boldtrip-platform:production
    env_file: ../.env.production
    restart: unless-stopped
    command: ["sh", "-c", "while true; do pnpm jobs:expire-bookings; sleep 60; done"]
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes: ["clamav-signatures:/var/lib/clamav"]
  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    command: ["--config.file=/etc/blackbox.yml"]
    volumes: ["./monitoring/blackbox.yml:/etc/blackbox.yml:ro"]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped
volumes:
  clamav-signatures:
  prometheus-data:
